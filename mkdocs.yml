site_name: ADK Agent Harness
site_description: Deep-agent harness for Google ADK — planning, subagents, background work, elicitation, and sandboxes on native ADK primitives.
site_url: https://manishdighore.github.io/adk-deep-agent/
repo_url: https://github.com/manishdighore/adk-deep-agent
repo_name: manishdighore/adk-deep-agent
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  variant: modern
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight

exclude_docs: |
  ADK-DEEP-AGENT.md
  ADK-DEEP-AGENT-IMPLEMENTATION-PLAN.md
  GITHUB_SETUP.md
  PUBLISHING.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Task ledger: guides/task-ledger.md
      - Subagents: guides/subagents.md
      - Background subagents: guides/background-subagents.md
      - Model selection: guides/models.md
      - Asking the user: guides/elicitation.md
      - Sandbox workspaces: guides/sandbox.md
      - Thinking, compaction, caching: guides/context.md
      - Interrupted tool calls: guides/tool-call-repair.md
      - Streaming to a UI: guides/streaming.md
      - Running in production: guides/production.md
  - API reference: reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]
